# /etc/nginx/sites-available/liquidation-radar
# Replace radar.example.com with your Timeweb domain, then:
#   ln -s /etc/nginx/sites-available/liquidation-radar /etc/nginx/sites-enabled/
#   certbot --nginx -d radar.example.com
# Certbot rewrites the TLS block below; the proxy settings stay as they are.
#
# REQUIRED: limit_req_zone is only valid in the http context, so add this line
# inside the http { } block of /etc/nginx/nginx.conf (not here):
#
#     limit_req_zone $binary_remote_addr zone=radar_login:10m rate=30r/m;
#
# Without it `nginx -t` fails on the limit_req directive below.

server {
    listen 80;
    listen [::]:80;
    server_name radar.example.com;

    # Certbot's ACME challenge is the only thing served over plain HTTP.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name radar.example.com;

    ssl_certificate     /etc/letsencrypt/live/radar.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radar.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # A whale report can take close to a minute; do not cut it off.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        # Slows credential guessing against the app's Basic auth.
        # Needs the radar_login zone declared in the http block (see header).
        limit_req zone=radar_login burst=20 nodelay;
        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app checks Basic auth itself, so the header must reach it intact.
        proxy_pass_request_headers on;
    }
}
